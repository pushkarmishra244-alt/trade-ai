name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend linting with Ruff
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev
      - name: Ruff lint check
        run: uv run ruff check .
        continue-on-error: true  # Pre-existing warnings in broker modules
      - name: Ruff format check
        run: uv run ruff format --check .
        continue-on-error: true  # Pre-existing formatting in broker modules

  # Backend tests (CI-safe subset - no broker credentials needed)
  # Matrixed across every Python the project supports (pyproject requires-python >=3.12).
  backend-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - name: Run CI-safe tests
        run: |
          uv run pytest test/test_log_location.py test/test_navigation_update.py \
            test/test_history_service_source_validation.py \
            test/test_python_editor.py test/test_rate_limits_simple.py \
            test/test_logout_csrf.py test/test_auth_logout.py \
            test/test_auth_resume.py test/test_auth_upsert_multisession.py \
            test/sandbox/test_execution_backlog.py test/test_event_bus_bounded.py \
            test/test_telegram_api_contract.py test/test_cors_config.py \
            test/test_market_calendar_validation.py \
            test/test_admin_client_error_url.py \
            test/test_core_credential_logging.py \
            test/test_multi_option_greeks_regression.py \
            test/test_history_format.py \
            test/test_precompress_assets.py \
            test/test_broker_credential_logging.py \
            test/test_option_symbol_service_validation.py \
            test/test_graceful_shutdown.py \
            test/test_flattrade_data_silence_watchdog.py \
            test/test_requirements_parity.py \
            -v --timeout=60

  # Frontend linting
  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  # The chart-indicator skill documents the openalgo-charts build that /trading
  # actually pins, so a version bump that leaves the skill behind fails here.
  # Both checks existed and nothing ran them: the export index sat on 1.8.1 while
  # the app shipped 2.1.5, so 26 exports were missing from the reference and the
  # count it advertised was wrong by 26.
  chart-indicator-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: export index matches the pinned openalgo-charts
        run: node .claude/skills/chart-indicator/generate-api-index.mjs --check
      - name: every export and capability is documented and demonstrated
        run: node .claude/skills/chart-indicator/coverage.mjs
      - name: drawing menu metadata matches the pinned package
        run: node frontend/scripts/generate-drawing-tools.mjs --check

  # The openscript skill documents the openalgo-script compiler that /trading
  # actually pins, and the same reasoning applies: a version bump that leaves the
  # skill behind leaves an author reading a page about a compiler that is no
  # longer installed.
  #
  # The third check is the one specific to this skill. Its pitfalls page teaches
  # by naming diagnostic codes, and an author trusts a code. Two of the claims on
  # the first draft were wrong: a stateful call in a branch is a warning rather
  # than a refusal, so "the compiler will catch it" was false, and the fix the
  # page offered for a conditional fill used a colour that does not exist. Both
  # were found by compiling the page's own snippets, which is what runs here.
  openscript-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: name reference matches the pinned openalgo-script
        run: node .claude/skills/openscript/generate-reference.mjs --check
      - name: every name is described, every planned name is marked, every shape is demonstrated
        run: node .claude/skills/openscript/coverage.mjs
      - name: every diagnostic code the pitfalls page names behaves as it says
        run: node .claude/skills/openscript/check-pitfalls.mjs

  # Frontend build (includes TypeScript check)
  # Matrixed across the LTS majors declared in frontend/package.json engines.
  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: frontend-dist-node${{ matrix.node-version }}
          path: frontend/dist/
          retention-days: 7

  # Frontend unit tests
  frontend-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-report-node${{ matrix.node-version }}
          path: frontend/coverage/
          retention-days: 7

  # Frontend E2E tests (Chromium only for speed)
  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=chromium
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --dev
      - name: Bandit security scan
        run: uv run bandit -r . -x .venv,test,frontend,node_modules -ll -f txt
        continue-on-error: true
      - name: pip-audit vulnerability scan
        run: uv run pip-audit
        continue-on-error: true

  # Auto-commit built frontend dist (main branch only)
  commit-dist:
    runs-on: ubuntu-latest
    needs: [frontend-build, frontend-lint, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Commit and push dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -f is needed because frontend/dist/ is gitignored for contributors,
          # but the pre-compressed variants stay excluded: gzip/brotli output is
          # incompressible and undeltifiable, so committing it on every rebuild
          # grew to two thirds of the repository history and tripled clone
          # times. utils/precompress_assets.py regenerates them at app startup.
          git add -f frontend/dist/ ':(exclude)frontend/dist/*.gz' ':(exclude)frontend/dist/*.br'
          git diff --staged --quiet || git commit -m "chore: auto-build frontend dist [skip ci]"
          git push

  # Required aggregate status check for the protected main branch.
  ci-gate:
    name: CI
    if: always()
    needs:
      - backend-lint
      - backend-test
      - frontend-lint
      - chart-indicator-skill
      - openscript-skill
      - frontend-build
      - frontend-test
      - frontend-e2e
      - security-scan
    runs-on: ubuntu-latest
    steps:
      - name: Verify required CI jobs
        run: |
          if [[ "${{ needs.backend-lint.result }}" != "success" ||
                "${{ needs.backend-test.result }}" != "success" ||
                "${{ needs.frontend-lint.result }}" != "success" ||
                "${{ needs.chart-indicator-skill.result }}" != "success" ||
                "${{ needs.openscript-skill.result }}" != "success" ||
                "${{ needs.frontend-build.result }}" != "success" ||
                "${{ needs.frontend-test.result }}" != "success" ||
                "${{ needs.frontend-e2e.result }}" != "success" ||
                "${{ needs.security-scan.result }}" != "success" ]]; then
            echo "One or more required CI jobs did not succeed."
            exit 1
          fi
          echo "All required CI jobs succeeded."
